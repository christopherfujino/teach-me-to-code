{{ define "main" }}

<h1>Posts</h1>
{{ with .Site.GetPage "/posts" }}
  {{ range .Pages }}
    <p style="display: grid; grid-template-columns: 6em 1fr;">
      <span>{{ .Date.Format "2006-01-02" }}</span>
      <a href="{{ .RelPermalink }}">
        <span>{{ .Title }}</span>
      </a>
    </p>
  {{ end }}
{{ end }}

{{ end }}
